<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - AI-Telegram Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/admin.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1e222d 0%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      padding: 2.5rem;
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary rounded-circle mb-3" style="width: 56px; height: 56px;">
        <i class="bi bi-robot text-white fs-2"></i>
      </div>
      <h4 class="fw-bold mb-1">AI-Telegram Admin</h4>
      <p class="text-secondary small mb-0">Hệ Thống Quản Trị & Tri Thức Ground Truth</p>
    </div>

    {% if error %}
      <div class="alert alert-danger alert-dismissible fade show small" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endif %}

    <form method="POST" action="/admin/login">
      <input type="hidden" name="next" value="{{ next or '/admin' }}">
      <div class="mb-3">
        <label for="username" class="form-label small text-secondary">Tên đăng nhập</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control bg-dark text-white border-secondary" id="username" name="username" placeholder="admin" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label small text-secondary">Mật khẩu</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control bg-dark text-white border-secondary" id="password" name="password" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-1"></i> Đăng Nhập
      </button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
